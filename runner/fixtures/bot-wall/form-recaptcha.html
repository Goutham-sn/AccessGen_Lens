<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join the newsletter</title>
<!-- bot wall: NOT a wall. A short sign-up form with an embedded reCAPTCHA
     box (a .g-recaptcha marker holding a frame from a CAPTCHA service).
     Its own form fields mean it is looked at as usual. -->
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; } label { display: block; margin-top: 8px; }</style>
</head>
<body>
<main>
  <h1>Join the newsletter</h1>
  <form action="/join" method="post">
    <label>Name <input name="name" autocomplete="name"></label>
    <label>Email <input name="email" type="email" autocomplete="email"></label>
    <div class="g-recaptcha">
      <iframe src="https://other-site.lens.test/recaptcha/api2/captcha-box.html" title="reCAPTCHA" width="304" height="78"></iframe>
    </div>
    <button type="submit">Sign up</button>
  </form>
</main>
</body>
</html>
