<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Many choices</title></head>
<!-- Served from another origin inside frame-stay.html: 70 buttons. -->
<body>
<div id="choices"></div>
<script>
  const box = document.getElementById('choices')
  for (let i = 1; i <= 70; i++) {
    const b = document.createElement('button')
    b.textContent = `Choice ${i}`
    box.appendChild(b)
  }
</script>
</body>
</html>
