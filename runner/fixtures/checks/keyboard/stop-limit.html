<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More stops than the walk looks at</title>
<!-- Zero moments, with a coverage line. 70 links inside the main landmark:
     the walk stops at 60, and one more press reaches link 61, which shows
     the page has more stops (61 presses in all). -->
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; } main a { margin-right: 8px; }</style>
</head>
<body>
<main id="links"><h1>Index</h1></main>
<script>
  const main = document.getElementById('links')
  for (let i = 1; i <= 70; i++) {
    const a = document.createElement('a')
    a.href = `/item/${i}`
    a.textContent = `Item ${i}`
    main.appendChild(a)
  }
</script>
</body>
</html>
