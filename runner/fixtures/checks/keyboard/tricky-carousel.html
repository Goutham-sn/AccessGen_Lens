<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tricky: a carousel moving next to focus</title>
<!-- Zero from every detector. The slides move all the time, right next to
     the buttons that get focus. The endless animation is not waited for,
     and movement never produces a moment. -->
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .viewport { overflow: hidden; width: 300px; height: 80px; border: 1px solid #999; }
  .track { display: flex; animation: slide 2s linear infinite; }
  .slide { flex: 0 0 150px; height: 80px; }
  .a { background: #f4a261; } .b { background: #2a9d8f; } .c { background: #e9c46a; } .d { background: #264653; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-300px); } }
</style>
</head>
<body>
<main>
  <div class="row">
    <button>Previous</button>
    <div class="viewport"><div class="track"><div class="slide a"></div><div class="slide b"></div><div class="slide c"></div><div class="slide d"></div></div></div>
    <button>Next</button>
  </div>
</main>
</body>
</html>
