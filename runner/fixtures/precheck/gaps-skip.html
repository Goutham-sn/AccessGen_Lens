<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skip links that appear on focus</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; position: relative; }
  .skip { position: absolute; left: -10000px; top: 10px; background: #ff0; padding: 4px; }
  .skip:focus { left: 10px; }
  .later:focus { left: 560px; top: 380px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sr:focus { width: auto; height: auto; clip: auto; left: 700px; top: 380px; background: #ff0; padding: 4px; }
  .place { position: absolute; top: 330px; display: block; width: 90px; height: 30px; background: #ddd; }
</style>
</head>
<body>
<!-- Out of sight until focused. The first appears in a corner. The others appear next to the place before them, so they are in sight when Tab lands on them. -->
<a class="skip" href="#a">Skip to content</a>
<a class="place" href="#b" style="left:560px">Place A</a>
<a class="place" href="#c" style="left:640px">Place B</a>
<a class="skip later" href="#d">Skip to footer</a>
<a class="sr" href="#e">Skip to search</a>
<div style="height:1200px"></div>
</body>
</html>
